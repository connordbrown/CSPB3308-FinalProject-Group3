{# contact_form.html #}
{% extends "base.html" %}
 {% block title %}{{ 'Edit Contact' if contact else 'Add Contact' }}{% endblock %}
 {% block content %}
   <h2 class='page-title'>{{ 'Edit Contact' if contact else 'Add Contact' }}</h2>
   {% if error %}
     <p class="error">{{ error }}</p>
   {% endif %}
   <form method="POST" class="container form-with-notes">
        <div class="left">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="{{ form.get('name') or '' }}" required>
            </div>

            <div>
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" value="{{ form.get('title') or '' }}">
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="{{ form.get('email') or '' }}">
            </div>

            <div>
                <label for="phone">Phone:</label>
                <input type="text" id="phone" name="phone" value="{{ form.get('phone') or '' }}">
            </div>

            <div>
                <label for="linkedin_url">LinkedIn:</label>
                <input type="url" id="linkedin_url" name="linkedin_url" value="{{ form.get('linkedin_url') or '' }}">
            </div>

            <div>
                <label for="company_id">Company:</label>
                <select id="company_id" name="company_id">
                    <option value="">None</option>
                    {% for company in companies %}
                        <option value="{{ company['id'] }}"
                        {% if form.get('company_id') | string == company['id']|string %}selected{% endif %}>
                        {{ company['name'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="new_company_name">Or add a new company:</label>
                <input type="text" id="new_company_name" name="new_company_name"
                    value="{{ form.get('new_company_name') or '' }}">
            </div>

            <div>
                <label for="job_id">Job:</label>
                <select id="job_id" name="job_id">
                    <option value="">None</option>
                    {% for job in jobs %}
                        <option value="{{ job['id'] }}"
                        {% if form.get('job_id')|string == job['id']|string %}selected{% endif %}>
                        {{ job['title'] }} - {{ job['company_name'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="designation">Designation:</label>
                <select id="designation" name="designation">
                    <option value="">None</option>
                    {% for designation in designations %}
                        <option value="{{ designation }}"
                        {% if form.get('designation') == designation %}selected{% endif %}>
                        {{ designation }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="right">
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes">{{ form.get('notes') or '' }}</textarea>
        </div>

        <div class="bottom same-line-wrap">
            <button type="submit">
                {{ 'Update Contact' if contact else 'Add Contact' }}
            </button>
            <button type="button" class="cancel">
                <a href="{{ url_for('contacts') }}">Cancel</a>
            </button>
        </div>
    </form>
{% endblock %}
