{# contact_form.html #}
{% extends "base.html" %}
 {% block title %}{{ 'Edit Contact' if contact else 'Add Contact' }}{% endblock %}
 {% block content %}
   <h2>{{ 'Edit Contact' if contact else 'Add Contact' }}</h2>
   {% if error %}
     <p class="error">{{ error }}</p>
   {% endif %}
   <form method="POST">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ contact.name if contact else '' }}" required><br>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ contact.title or '' if contact else '' }}"><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ contact.email or '' if contact else '' }}"><br>
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" value="{{ contact.phone or '' if contact else '' }}"><br>
        <label for="linkedin_url">LinkedIn:</label>
        <input type="url" id="linkedin_url" name="linkedin_url" value="{{ contact.linkedin_url or '' if contact else '' }}"><br>
        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes">{{ contact.notes or '' if contact else '' }}</textarea><br>
        <label for="company_id">Company:</label>
        <select id="company_id" name="company_id">
            <option value="">None</option>
            {% for company in companies %}
                <option value="{{ company['id'] }}" >{{ company['name'] }}</option>
            {% endfor %}
           <label for="new_company_name">Or add a new company:</label>
        <input type="text" id="new_company_name" name="new_company_name"><br>
        </select><br>
        <label for="job_id">Job:</label>
        <select id="job_id" name="job_id">
            <option value="">None</option>
            {% for job in jobs %}
                <option value="{{ job['id'] }}" >{{ job['title'] }} - {{ job['company_name'] }}</option>
            {% endfor %}
        </select><br>
        <label for="designation">Designation:</label>
        <select id="designation" name="designation">
            <option value="">None</option>
            {% for designation in designations %}
                <option value="{{ designation }}" >{{ designation }}</option>
            {% endfor %}
        </select><br>
        <button type="submit"> {{ 'Update Contact' if contact else 'Add Contact' }}</button>
           <a href="{{ url_for('contacts') }}">Cancel</a>
    </form>
        {% endblock %}
