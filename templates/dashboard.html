{% extends "base.html" %}

{% block title %}Dashboard - Prospex{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/jobs.css') }}">
{% endblock %}

{% block content %}
<h1>Dashboard</h1>
<p>Where your job search lives</p>

<div class="jobs-list">
{% for job in jobs %}
    <button
        class="job-tile {{ job.status }}"
        onclick="window.location.href='jobs/{{ job.id }}' ">

        <div>{{ job.title }}</div>

        <!-- Temporary - to confirm links for now -->
        <div>Job ID: {{ job.id }}</div>

        <div>Company ID: {{ job.company_id }}</div>
    </button>
{% endfor %}
</div>

{% endblock %}
